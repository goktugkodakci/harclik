<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Harçlık</title>
  <meta name="description" content="Ay başı ve ay ortası gelen harçlığını bir sonrakine kadar idare etmek için basit bütçe uygulaması.">
  <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121411" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Harçlık">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="app" class="app" tabindex="-1">
    <noscript><p class="noscript">Harçlık'ın çalışması için JavaScript açık olmalı.</p></noscript>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Ana menü" hidden>
    <div class="tabbar-inner">
      <button type="button" class="tab" data-view="summary" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/>
        </svg>
        <span>Özet</span>
      </button>
      <button type="button" class="fab" id="add-button" aria-label="Harcama ekle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" focusable="false">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <button type="button" class="tab" data-view="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M9 6h11M9 12h11M9 18h11"/>
          <circle cx="4.5" cy="6" r="1" fill="currentColor"/>
          <circle cx="4.5" cy="12" r="1" fill="currentColor"/>
          <circle cx="4.5" cy="18" r="1" fill="currentColor"/>
        </svg>
        <span>Geçmiş</span>
      </button>
    </div>
  </nav>

  <div class="toast-region" id="toasts" aria-live="polite"></div>
</body>
</html>
